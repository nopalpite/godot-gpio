# Lint GDScript, compilation de la GDExtension (Linux x86_64 + arm64, debug + release),
# test du projet d'exemple en headless, puis paquet de l'addon prêt à copier.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GDTOOLKIT_VERSION: "4.5.0"
  ZIG_VERSION: "0.17.1"

jobs:
  lint:
    name: Lint GDScript
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "gdtoolkit==${GDTOOLKIT_VERSION}"
      - name: gdlint
        run: gdlint project
      - name: gdformat --check
        run: gdformat --check project

  build:
    name: GDExtension ${{ matrix.arch }} ${{ matrix.target }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        target: [template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # zig sert de compilateur croisé : même chaîne pour les deux architectures,
      # glibc 2.28 visée (compatible avec toutes les versions récentes de Raspberry Pi OS).
      - run: pip install scons "ziglang==${ZIG_VERSION}"
      - name: Compilation
        run: |
          ZIG="$(python -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
          scons platform=linux arch=${{ matrix.arch }} target=${{ matrix.target }} zig="$ZIG" -j"$(nproc)"
      - name: Vérification du binaire
        run: |
          file project/addons/gpio/bin/*.so
          nm -D --defined-only project/addons/gpio/bin/*.so | grep gpio_library_init
      # Si le quota de stockage d'artefacts de l'organisation est plein, l'envoi échoue :
      # on ne fait pas échouer la compilation pour autant (seul le job « paquet » en dépend).
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: bin-${{ matrix.arch }}-${{ matrix.target }}
          path: project/addons/gpio/bin/*.so
          if-no-files-found: error
          retention-days: 3

  test:
    name: Test headless (${{ matrix.toolchain }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [gcc, zig]
    env:
      # La glibc écrit ses erreurs fatales (ex. « free(): invalid pointer ») sur /dev/tty.
      LIBC_FATAL_STDERR_: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install scons "ziglang==${ZIG_VERSION}"
      # Compilé ici plutôt que téléchargé : le test ne dépend pas du stockage d'artefacts.
      - name: Compilation x86_64 debug
        run: |
          if [ "${{ matrix.toolchain }}" = "zig" ]; then
            ZIG="$(python -c 'import os, ziglang; print(os.path.join(os.path.dirname(ziglang.__file__), "zig"))')"
            scons platform=linux arch=x86_64 target=template_debug zig="$ZIG" -j"$(nproc)"
          else
            scons platform=linux arch=x86_64 target=template_debug -j"$(nproc)"
          fi
      - name: Installation de Godot
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
      # Limite connue : avec l'extension, Godot 4.7.2 plante en quittant le tout PREMIER
      # import d'un projet (l'import lui-même est terminé, le second est propre, le jeu aussi).
      # On tolère donc ce premier plantage, mais le second import doit réussir.
      - name: Import du projet
        run: |
          ./godot --headless --path project --import || echo "::warning::Premier import : Godot a quitté avec le code $? (limite connue, voir README)."
          ./godot --headless --path project --import
      # Sur le runner, l'extension x86_64 est chargée mais il n'y a aucune puce GPIO :
      # l'autoload doit passer en simulation et l'extension renvoyer des erreurs lisibles.
      - name: Test
        run: |
          ./godot --headless --path project res://tests/test_simulation.tscn || {
            code=$?
            if [ "$code" -gt 1 ]; then
              echo "::error::Godot a planté pendant le test ; trace gdb ci-dessous."
              sudo apt-get install -y -qq gdb > /dev/null
              gdb -q -batch -ex run -ex "thread apply all bt 30" --args ./godot --headless --verbose --path project res://tests/test_simulation.tscn
            fi
            exit 1
          }
      # Sans puce GPIO, le banc matériel doit tout ignorer, sans planter (code 0).
      - name: Banc matériel (sans puce)
        run: ./godot --headless --path project res://banc/test_materiel.tscn

  package:
    name: Paquet de l'addon
    needs: [build, test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: project/addons/gpio/bin
          merge-multiple: true
      # download-artifact ne signale rien s'il ne trouve aucun binaire : on
      # refuse de publier un addon sans ses quatre bibliothèques.
      - name: Vérifier les binaires
        run: |
          ls -l project/addons/gpio/bin/ || true
          for arch in x86_64 arm64; do
            for target in template_debug template_release; do
              file="project/addons/gpio/bin/libgpio.linux.${target}.${arch}.so"
              if [[ ! -s "$file" ]]; then
                echo "::error::Binaire manquant : $file"
                missing=1
              fi
            done
          done
          exit "${missing:-0}"
      - uses: actions/upload-artifact@v4
        with:
          name: addon-gpio
          # Le zip contient le dossier « gpio/ » : à copier dans res://addons/.
          path: project/addons
          if-no-files-found: error
          retention-days: 30
      # Projet complet (exemple + banc de test + bibliothèques) à copier sur le Pi.
      - uses: actions/upload-artifact@v4
        with:
          name: projet-gpio
          path: project
          if-no-files-found: error
          retention-days: 30
